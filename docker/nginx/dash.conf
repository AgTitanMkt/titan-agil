server {
    listen 80;
    server_name dash.agenciatitandev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dash.agenciatitandev.com;

    ssl_certificate /etc/letsencrypt/live/dash.agenciatitandev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.agenciatitandev.com/privkey.pem;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    resolver 127.0.0.11 8.8.8.8 valid=10s;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $backend "laravel_docker-app-1:9000";
        fastcgi_pass $backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
