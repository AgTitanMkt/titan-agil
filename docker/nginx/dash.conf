server {
    listen 80;
    server_name dash.agenciatitandev.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name dash.agenciatitandev.com;
    root /var/www/public;
    index index.php index.html;
    ssl_certificate /etc/letsencrypt/live/dash.agenciatitandev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.agenciatitandev.com/privkey.pem;
    charset utf-8;
    location /build/ {
        alias /var/www/public/build/;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass laravel_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
    location ~ /\.ht {
        deny all;
    }
}