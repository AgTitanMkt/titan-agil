upstream laravel {
    server laravel_blue:9000;
}

server {
    listen 80;
    server_name dash.agenciatitandev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {

    listen 443 ssl;
    server_name dash.agenciatitandev.com;

    ssl_certificate /etc/letsencrypt/live/dash.agenciatitandev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.agenciatitandev.com/privkey.pem;

    root /var/www/public;
    index index.php;

    location / {
        proxy_pass http://laravel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
