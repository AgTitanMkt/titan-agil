name: laravel_docker

networks:
  titan_network:
    external: true

services:

  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    restart: always
    networks:
      - titan_network

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ..:/var/www
      - ./nginx/dash.conf:/etc/nginx/conf.d/dash.conf
      - /var/lib/jenkins/workspace/titan-vsl/docker/nginx/vsl.conf:/etc/nginx/conf.d/vsl.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - app
    networks:
      - titan_network
