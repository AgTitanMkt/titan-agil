services:

  app_blue:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: laravel_blue
    volumes:
      - /var/lib/jenkins/workspace/Titan-Agil:/var/www
    networks:
      - laravel

  app_green:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: laravel_green
    volumes:
      - /var/lib/jenkins/workspace/Titan-Agil:/var/www
    networks:
      - laravel

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    networks:
      - laravel

networks:
  laravel:
