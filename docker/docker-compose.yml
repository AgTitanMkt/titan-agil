networks:
  titan_network:
    external: true

services:

  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    restart: always
    volumes:
      - ..:/var/www
    networks:
      - titan_network

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ..:/var/www
      - ./nginx/dash.conf:/etc/nginx/conf.d/dash.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - app
    networks:
      - titan_network
