services:

  app_blue:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: laravel_blue
    networks:
      - laravel

  app_green:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: laravel_green
    networks:
      - laravel

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    networks:
      - laravel

networks:
  laravel:
